# ==============================================================================
# SOL Global / US-DZ Airlift & Livestock Trace Platform
# Eclipse Mosquitto 2.x Broker Production Configuration
# ==============================================================================

# 1. Standard MQTT TCP Listener (Hardware Scanners, ESP32, IoT Edge Bridges)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# 2. WebSocket Listener (Browser Dashboards, Web Handheld Terminals, Flutter Web)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# 3. Message Persistence
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800
autosave_on_changes false

# 4. Logging & Diagnostics
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# 5. Performance & Resource Limits
max_connections -1
max_queued_messages 10000
max_inflight_messages 100
message_size_limit 10485760

# 6. Connection Keep-Alive
keepalive_interval 60
