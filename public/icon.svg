<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded tactical shape -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#10b981" stroke-width="8"/>
  
  <!-- Radar concentric circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>

  <!-- Airlift Flight Vector Path -->
  <path d="M120 370 Q 256 120 392 370" fill="none" stroke="url(#emeraldGlow)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Cargo Jet Plane Icon -->
  <g transform="translate(256, 175) scale(1.1) translate(-24, -24)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#34d399"/>
  </g>

  <!-- Cow Head & RFID Smart Tag Silhouette in Tactical Center -->
  <g transform="translate(256, 320) scale(1.6) translate(-24, -20)">
    <!-- Cow Head Path -->
    <path d="M14 6 C12 3, 7 3, 6 6 C5 8, 7 12, 10 13 C9 17, 10 21, 12 24 C14 26, 18 26, 20 24 C22 21, 23 17, 22 13 C25 12, 27 8, 26 6 C25 3, 20 3, 18 6 C17 5.5, 15 5.5, 14 6 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Holstein Spots -->
    <circle cx="14" cy="11" r="2.5" fill="#0f172a"/>
    <ellipse cx="18" cy="16" rx="2" ry="3" fill="#0f172a"/>
    <!-- Muzzle -->
    <ellipse cx="16" cy="23" rx="3.5" ry="2" fill="#cbd5e1"/>
    <!-- RFID Ear Tag with glow -->
    <circle cx="8" cy="9" r="3" fill="#f59e0b"/>
    <circle cx="8" cy="9" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Pulse waves from RFID -->
  <path d="M236 295 A 16 16 0 0 0 236 325" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M226 288 A 28 28 0 0 0 226 332" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Tactical Text HUD -->
  <text x="256" y="440" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="4">SOL GLOBAL • US-DZ</text>
  <text x="256" y="468" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="2">LIVESTOCK TRACE HUD</text>
</svg>
