name: flutter_rfid_field_app
description: SOL Global - Tactical Handheld RFID Field Scanner for Livestock Airlift & Quarantine Herd Tracking (ISO 11784/11785 FDX-B)
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  csv: ^6.0.0
  intl: ^0.19.0
  path_provider: ^2.1.2
  vibration: ^1.9.0
  flutter_ringtone_player: ^3.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
